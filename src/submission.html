<!doctype html>
<html lang="is">
  <head>
    <title>Bókaskráning!</title>
    <link rel="icon" href="../images/icon.svg" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="../srcJS/main.js"></script>
  </head>

  <body>
    <header>
      <h2>Bækur!</h2>
      <div class="valmynd">
        <a href="../index.html"><p>Bækur</p></a>
        <p>Bæta við bók</p>
      </div>
      <div class="book-searcher">
        <form>
          <input
            name="book-search-input"
            id="book-search-input"
            placeholder="Leitaðu af bók!"
          />
        </form>
        <ul class="search-results"></ul>
      </div>
      <!-- Þetta er  kubburinn sem inniheldur search bar-ið -->
    </header>

    <main class="submain">
      <h1>Bókaskráning!</h1>
      <form class="book-form">
        <label for="title">Titill</label><br />
        <input type="text" id="title" name="title" required /><br />
        <label for="author">Höfundur (valfrjálst)</label><br />
        <input type="text" id="author" name="author" /><br />
        <label for="description">Lýsing (valfrjálst)</label><br />
        <input type="text" id="description" name="description" /><br />
        <label for="cover">Kápa (valfrjálst)</label><br />
        <input type="text" id="cover" name="cover" /><br />
        <label for="submission">Skila</label><br />
        <input type="submit" id="submission" />
      </form>
    </main>

    <footer>
      <div class="heimilisfang">
        <p>Antartica</p>
        <p>Davis Station</p>
      </div>

      <div class="simanr">
        <p>Sími +354 123-4567</p>
        <p>Hafa samband: <a href="mailto:bok@bokin.is">bok@bokin.is</a></p>
      </div>
    </footer>
  </body>
</html>
