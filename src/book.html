<!DOCTYPE html>
<html lang="is">
    <head>
        <title>Bók!</title>
        <link rel="icon" href="../images/icon.svg">
    <meta charset="utf-8" />
<script type="module" src="/srcJS/main.js"></script>
    </head>
    <header>
            <div class="book-searcher">
            
            <form>
                <label for="book-search-input">Leitaðu af bók!</label><br>
                <input name="book-search-input" id="book-search-input">
            </form>
            <ul class="search-results">

                </ul>
        </div> <!-- Þetta er  kubburinn sem inniheldur search bar-ið -->
            <h1>Bækur!</h1>
        </header>
<body>
    <div class="book-container">
        <div class="book-review-average">
            <img src="images/star-full.svg" alt="star" height="16px">
            <img src="../images/star-open-full.svg" alt="star" height="16px"><img src="../images/star-close-full.svg" alt="star" height="16px">
            <img src="../images/star-open-full.svg" alt="star" height="16px"><img src="../images/star-close-full.svg" alt="star" height="16px">
            <img src="../images/star-open-full.svg" alt="star" height="16px"><img src="../images/star-close-full.svg" alt="star" height="16px">
            <img src="../images/star-open-full.svg" alt="star" height="16px"><img src="../images/star-close-empty.svg" alt="star" height="16px">
            <img src="../images/star-open-empty.svg" alt="star" height="16px"><img src="../images/star-close-empty.svg" alt="star" height="16px">
        </div>
    </div>

    <button class="open-review">Gefðu umsögn</button> <!-- Þessi takki skal opna dropdown að review forminu. -->
    <form class="dropdown-form">
        <label for="review-text">Skrifaðu umsögn (valfrjálst)</label><br>
        <input type="text" id="review-text"><br>
        <label for="review-start">Hvenær byrjaðiru lesturinn? (valfrjálst)</label><br>
        <input type="date" id="review-text"><br>
        <label for="review-end">Hvenær ljóskt þú lesturinn? (valfrjálst)</label><br>
        <input type="date" id="review-text"><br>
        <div>
            <!-- Hérna eru allar 5 stjörnur, við viljum fylla hlutann sem þú ýtir á og líka stjörnurnar á undan því.-->
            <img src="../images/star-open-empty.svg" alt="star" height="24px" id="1"><img src="../images/star-close-empty.svg" alt="star" height="24px" id="2">
            <img src="../images/star-open-empty.svg" alt="star" height="24px" id="3"><img src="../images/star-close-empty.svg" alt="star" height="24px" id="4">
            <img src="../images/star-open-empty.svg" alt="star" height="24px" id="5"><img src="../images/star-close-empty.svg" alt="star" height="24px" id="6">
            <img src="../images/star-open-empty.svg" alt="star" height="24px" id="7"><img src="../images/star-close-empty.svg" alt="star" height="24px" id="8">
            <img src="../images/star-open-empty.svg" alt="star" height="24px" id="9"><img src="../images/star-close-empty.svg" alt="star" height="24px" id="10">

        </div>
        <button class="review-submit">Skila umsögn</button>

    </form>

    <ul class="review-list">
       
    </ul>
    

</body>
    </html>
